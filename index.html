<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyrox 12 Wochen</title>
<meta name="description" content="12-Wochen-Trainingsplan für Hyrox – offline nutzbar, Daten bleiben auf dem Handy.">
<meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("hyrox12-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app"><p class="muted">Lädt …</p></div>
<div class="watch" id="watch" hidden><div><span class="clock" id="clock">00:00</span><button type="button" id="wStart" class="go">Start</button><button type="button" id="wReset">Reset</button><button type="button" id="wTake">Zeit eintragen</button></div></div>
<noscript><p style="padding:16px">Diese App braucht JavaScript.</p></noscript>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
